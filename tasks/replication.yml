# =============================================================================
# Replication Setup — Replica Set (Primary/Secondary)
# Flow:
#   1. Initiate the replica set from the primary using rs.initiate()
#   2. If authentication is enabled, the very first run will fail because no
#      users exist yet — in that case, switch to a temporary no-auth config,
#      create the HA users, then re-run rs.initiate() and switch back.
# =============================================================================

- name: Place replica set initiate script on primary node
  ansible.builtin.template:
    src: repset_init.js.j2
    dest: /tmp/repset_init.js
  when: inventory_hostname in groups[mongodb_master_group]

- name: Initiate the replica set
  ansible.builtin.shell: >
    /usr/bin/mongosh
    {{ '--authenticationDatabase admin -u ' + mongo_root_admin_name + ' -p ' + mongo_root_admin_pwd if mongodb_authentication_enabled | default(true) else '' }}
    < /tmp/repset_init.js
  register: rep_initiate
  changed_when: "'ok' in rep_initiate.stdout"
  failed_when: false
  no_log: true
  when: inventory_hostname in groups[mongodb_master_group]

# =====================================================
# First-run fallback: no users exist yet, so the
# authenticated initiate above failed. Switch to a
# temporary no-auth config, create users, then retry.
# =====================================================

- name: Use temporary no-auth config for initial bootstrap
  ansible.builtin.template:
    src: mongod_init.conf.j2
    dest: /etc/mongod.conf
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    mode: "0644"
  notify:
    - mongodb_restart
    - wait_till_mongodb_started_on_localhost
  when:
    - mongodb_authentication_enabled | default(true)
    - rep_initiate is failed
    - inventory_hostname in groups[mongodb_master_group]

- name: Flush handlers to apply bootstrap config
  ansible.builtin.meta: flush_handlers

- name: Re-initiate the replica set without authentication
  ansible.builtin.shell: >
    /usr/bin/mongosh < /tmp/repset_init.js
  changed_when: true
  when:
    - mongodb_authentication_enabled | default(true)
    - rep_initiate is failed
    - inventory_hostname in groups[mongodb_master_group]

- name: Wait for replica set to elect a primary
  ansible.builtin.pause:
    seconds: 15
  when:
    - rep_initiate is failed
    - inventory_hostname in groups[mongodb_master_group]

- name: Create HA users now that the replica set is initiated
  ansible.builtin.include_tasks: users.yml
  when:
    - mongodb_authentication_enabled | default(true)
    - rep_initiate is failed

- name: Restore mongod.conf with authentication enabled
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    mode: "0644"
  notify:
    - mongodb_restart
    - wait_till_mongodb_started
  when:
    - mongodb_authentication_enabled | default(true)
    - rep_initiate is failed

- name: Flush handlers to restore authenticated config
  ansible.builtin.meta: flush_handlers

- name: Validate replica set status
  ansible.builtin.shell: >
    /usr/bin/mongosh
    {{ '--authenticationDatabase admin -u ' + mongo_root_admin_name + ' -p ' + mongo_root_admin_pwd if mongodb_authentication_enabled | default(true) else '' }}
    --quiet --eval "rs.status().members.forEach(m => print(m.name + ' -> ' + m.stateStr))"
  register: replica_status
  changed_when: false
  no_log: true
  when: inventory_hostname in groups[mongodb_master_group]

- name: Display replica set status
  ansible.builtin.debug:
    var: replica_status.stdout_lines
  when: inventory_hostname in groups[mongodb_master_group]
