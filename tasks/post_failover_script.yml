# =============================================================================
# Post-Failover Resync Script Deployment
# Helper script to re-add a recovered node to the replica set / resync data
# from the latest backup after a primary failover
# =============================================================================

- name: Deploy post-failover resync script
  ansible.builtin.template:
    src: post-failover-action.sh.j2
    dest: "{{ mongodb_ha_failover_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Validate post-failover script syntax
  ansible.builtin.command: >
    bash -n {{ mongodb_ha_failover_script_path }}
  changed_when: false
  register: script_syntax_check
  failed_when: script_syntax_check.rc != 0
