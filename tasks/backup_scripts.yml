# =============================================================================
# HA Backup Scripts — runs on the secondary/backup node
# Uses mongodump against the local secondary (--readPreference secondary)
# Storage type controlled by mongodb_ha_backup_storage toggle:
#   minio — streams archive to MinIO (mc client already configured)
#   local — stores on local disk
# =============================================================================

# ── Local storage setup ────────────────────────────────────────────────────
- name: Create local backup directory
  ansible.builtin.file:
    path: "{{ mongodb_ha_local_backup_path }}"
    state: directory
    owner: "{{ mongodb_ha_local_backup_owner }}"
    group: "{{ mongodb_ha_local_backup_group }}"
    mode: "{{ mongodb_ha_local_backup_mode }}"
  when: mongodb_ha_backup_storage == "local"

# ── Common setup ────────────────────────────────────────────────────────────
- name: Create backup log file
  ansible.builtin.file:
    path: "{{ mongodb_ha_backup_log_file }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# ── Deploy backup script based on storage type ────────────────────────────────
# minio → mongodb-full-backup-minio.sh.j2
# local → mongodb-full-backup-local.sh.j2
- name: Deploy full backup script
  ansible.builtin.template:
    src: "mongodb-full-backup-{{ mongodb_ha_backup_storage }}.sh.j2"
    dest: "{{ mongodb_ha_backup_scripts_path }}/mongodb-full-backup.sh"
    owner: root
    group: root
    mode: "0755"

# ── Cron job ───────────────────────────────────────────────────────────────
- name: Setup full backup cron job
  ansible.builtin.cron:
    name: "MongoDB HA full backup"
    minute: "{{ mongodb_ha_backup_full_cron_minute }}"
    hour: "{{ mongodb_ha_backup_full_cron_hour }}"
    weekday: "{{ mongodb_ha_backup_full_cron_weekday }}"
    job: "{{ mongodb_ha_backup_scripts_path }}/mongodb-full-backup.sh >> {{ mongodb_ha_backup_log_file }} 2>&1"
    user: root
    state: present
  when: >
    mongodb_setup_backup_cron | default(false) or
    mongodb_backup_server | default(false)

