---
# tasks file for mongodb

- name: Install Mongodb and depedencies
  ansible.builtin.include_tasks: install_mongo_redhat.yml

- name: Setup Mongodb service
  ansible.builtin.include_tasks: mongo_service_file_setup.yml

- name: Configure Mongo
  ansible.builtin.include_tasks: configure.yml

- name: Initiate Replication
  ansible.builtin.include_tasks: initiate_mongo_replication.yml
  when: replication_enabled

- name: Setup authentication
  ansible.builtin.include_tasks: setup_authentication_mongo.yml
  when: authentication_enabled
