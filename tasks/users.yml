---
# =============================================================================
# MongoDB Users Setup — HA Users
# Created only on PRIMARY
# Users replicate automatically to SECONDARY nodes
# =============================================================================

- name: Create root admin user
  community.mongodb.mongodb_user:
    database: admin
    name: "{{ mongo_root_admin_name }}"
    password: "{{ mongo_root_admin_pwd }}"
    update_password: on_create
    roles: root
    state: present

    create_for_localhost_exception: /var/lib/mongodb/.mongodb_admin_created

    login_user: "{{ mongo_root_admin_name if not mongodb_bootstrap_mode else omit }}"
    login_password: "{{ mongo_root_admin_pwd if not mongodb_bootstrap_mode else omit }}"
    login_database: admin
  when:
    - inventory_hostname in groups[mongodb_master_group]
  run_once: true
  no_log: true

# =============================================================================
# User Admin
# =============================================================================

- name: Create user admin
  community.mongodb.mongodb_user:
    database: admin
    name: "{{ mongo_user_admin_name }}"
    password: "{{ mongo_user_admin_pwd }}"
    update_password: on_create
    roles: userAdminAnyDatabase
    state: present

    login_user: "{{ mongo_root_admin_name }}"
    login_password: "{{ mongo_root_admin_pwd }}"
    login_database: admin
  when:
    - inventory_hostname in groups[mongodb_master_group]
    - mongodb_authentication_enabled | default(true)
    - not mongodb_bootstrap_mode
  run_once: true
  no_log: true

# =============================================================================
# Backup User
# =============================================================================

- name: Create backup root user
  community.mongodb.mongodb_user:
    database: admin
    name: "{{ mongo_root_backup_name }}"
    password: "{{ mongo_root_backup_pwd }}"
    update_password: on_create
    roles:
      - backup
      - clusterMonitor
    state: present

    login_user: "{{ mongo_root_admin_name }}"
    login_password: "{{ mongo_root_admin_pwd }}"
    login_database: admin
  when:
    - inventory_hostname in groups[mongodb_master_group]
    - mongodb_authentication_enabled | default(true)
    - not mongodb_bootstrap_mode
  run_once: true
  no_log: true
