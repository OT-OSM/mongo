# =============================================================================
# MongoDB Configuration
# Section 1 — Service setup (user/group, systemd unit, log/data dirs)
# Section 2 — Replication keyfile (HA only)
# Section 3 — mongod.conf rendering
# =============================================================================

# =====================================================
# SECTION 1 — Service Setup
# =====================================================

- name: Create mongodb group
  ansible.builtin.group:
    name: "{{ mongo_service_group }}"
    state: present

- name: Create mongodb user
  ansible.builtin.user:
    name: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    state: present

- name: Setup mongod systemd service file
  ansible.builtin.template:
    src: mongod.service.j2
    dest: "/lib/systemd/system/{{ mongo_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: ansible_service_mgr == "systemd"
  notify: reload_systemd

- name: Add symlink for systemd
  ansible.builtin.file:
    src: "/lib/systemd/system/{{ mongo_service_name }}.service"
    dest: "/etc/systemd/system/multi-user.target.wants/{{ mongo_service_name }}.service"
    state: link
  when: ansible_service_mgr == "systemd"
  notify: reload_systemd

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

- name: Enable mongod service
  ansible.builtin.service:
    name: "{{ mongo_service_name }}"
    enabled: true

- name: Create systemlog directory if missing
  ansible.builtin.file:
    state: directory
    dest: "{{ mongo_systemlog_path | dirname }}"
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    mode: "0755"
  when: mongo_systemlog_destination == "file"

- name: Check systemlog file exists
  ansible.builtin.stat:
    path: "{{ mongo_systemlog_path }}"
  register: logfile_stat
  when: mongo_systemlog_destination == "file"

- name: Create systemlog file if missing
  ansible.builtin.file:
    state: touch
    dest: "{{ mongo_systemlog_path }}"
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when:
    - mongo_systemlog_destination == "file"
    - logfile_stat is defined
    - not logfile_stat.stat.exists

- name: Create MongoDB data directory
  ansible.builtin.file:
    path: "{{ mongo_db_path }}"
    state: directory
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    mode: "0755"

- name: Ensure MongoDB data directory ownership
  ansible.builtin.file:
    path: "{{ mongo_db_path }}"
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    recurse: true

# =====================================================
# SECTION 2 — Replication Keyfile
# Required for inter-node auth when both auth and
# replication are enabled
# =====================================================

- name: Place authentication keyfile on each node
  ansible.builtin.copy:
    dest: "/etc/{{ mongo_authentication_keyname }}"
    content: "{{ mongo_authentication_key }}"
    mode: "0400"
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
  when:
    - mongodb_authentication_enabled | default(true)
    - mongodb_replication | default(false)

# =====================================================
# SECTION 3 — mongod.conf
# =====================================================

- name: Render mongod.conf
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: "{{ mongo_service_user }}"
    group: "{{ mongo_service_group }}"
    mode: "0644"
  notify:
    - mongodb_restart
    - "{{ 'wait_till_mongodb_started' if mongodb_replication | default(false) else 'wait_till_mongodb_started_on_localhost' }}"

- name: Flush handlers to apply config changes
  ansible.builtin.meta: flush_handlers
