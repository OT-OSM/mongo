---
- name: Create mongodb_exporter system user
  ansible.builtin.user:
    name: "{{ mongodb_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
  tags: mongodb_metrics

- name: Download mongodb_exporter
  ansible.builtin.unarchive:
    src: "{{ mongodb_exporter_download_url }}"
    dest: /tmp
    remote_src: true
  tags: mongodb_metrics

- name: Install mongodb_exporter binary
  ansible.builtin.copy:
    src: "/tmp/mongodb_exporter-{{ mongodb_exporter_version }}.linux-amd64/mongodb_exporter"
    dest: /usr/local/bin/mongodb_exporter
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  tags: mongodb_metrics

- name: Create exporter config directory
  ansible.builtin.file:
    path: /etc/mongodb_exporter
    state: directory
    owner: "{{ mongodb_exporter_user }}"
    group: "{{ mongodb_exporter_user }}"
    mode: "0700"
  tags: mongodb_metrics

- name: Render exporter environment file
  ansible.builtin.template:
    src: mongodb_exporter.env.j2
    dest: /etc/mongodb_exporter/mongodb_exporter.env
    owner: "{{ mongodb_exporter_user }}"
    group: "{{ mongodb_exporter_user }}"
    mode: "0600"
  tags: mongodb_metrics

- name: Deploy mongodb_exporter systemd service
  ansible.builtin.template:
    src: mongodb_exporter.service.j2
    dest: /etc/systemd/system/mongodb_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: reload_systemd
  tags: mongodb_metrics

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers
  tags: mongodb_metrics

- name: Enable and start mongodb_exporter
  ansible.builtin.service:
    name: mongodb_exporter
    state: started
    enabled: true
  tags: mongodb_metrics
