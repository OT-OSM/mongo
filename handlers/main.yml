---
- name: reload_systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: reload_systemd

- name: mongodb_restart
  ansible.builtin.service:
    name: "{{ mongo_service_name }}"
    state: restarted
  listen: mongodb_restart

- name: restart_mongodb_exporter
  ansible.builtin.service:
    name: "{{ mongodb_exporter_service_name }}"
    state: restarted
    enabled: true
  listen: restart_mongodb_exporter

- name: wait_till_mongodb_started
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: "{{ mongo_port }}"
    timeout: 120
  with_items:
    - "{{ groups[mongodb_master_group] | default([]) | list }}"
    - "{{ groups[mongodb_slave_group] | default([]) | list }}"
  listen: wait_till_mongodb_started

- name: wait_till_mongodb_started_on_localhost
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ mongo_port }}"
    delay: 5
    timeout: 120
  listen: wait_till_mongodb_started_on_localhost
