---
# =============================================================================
# MongoDB Server HA — Default Variables
# All variables are prefixed with `mongodb_` to avoid collisions with other
# roles. Override credentials via Semaphore environment variables or
# Ansible Vault — never commit real passwords.
# =============================================================================

# =====================================================
# Feature Toggles — MongoDB Core
# =====================================================
mongodb_install_packages: true
mongodb_replication: true
mongodb_authentication_enabled: true
mongodb_custom_users_creation: false
mongodb_users_creation: true
mongodb_root_password_update: false

# =====================================================
# Feature Toggles — HA / Add-on Components
# =====================================================
mongodb_arbiter_configure: true          # Add an arbiter node to the replica set
mongodb_metrics_enabled: true            # Install mongodb_exporter for Prometheus

# =====================================================
# Inventory Group Names
# =====================================================
mongodb_master_group: mongo_master
mongodb_slave_group: mongo_slave
mongodb_arbiter_group: mongo_arbiter

# =====================================================
# MongoDB Installation
# =====================================================
mongo_version: "8.0"
mongo_major_version: "8.0"
mongo_package_name: mongodb-org

mongo_apt_repo_url: http://repo.mongodb.org/apt/ubuntu
mongo_apt_key_id:
  "8.0": "4B7C549A058F8B6B"
mongo_apt_key_server: keyserver.ubuntu.com

pymongo_pip_version: 4.8.0

mongo_redhat_url: https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org
mongo_redhat_repository:
  "8.0": "{{ mongo_redhat_url }}/8.0/$basearch/"
mongo_redhat_repository_gpgkey:
  "8.0": "https://pgp.mongodb.com/server-8.0.asc"

mongo_amazon_url: https://repo.mongodb.org/yum/amazon/2/mongodb-org
mongo_amazon_repository:
  "8.0": "{{ mongo_amazon_url }}/8.0/$basearch/"

yum_lock_timeout: 180
epel_release_rpm: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm

# =====================================================
# MongoDB Service
# =====================================================
mongo_service_name: mongod
mongo_service_user: "{{ 'mongodb' if ansible_os_family == 'Debian' else 'mongod' }}"
mongo_service_group: "{{ 'mongodb' if ansible_os_family == 'Debian' else 'mongod' }}"

# =====================================================
# MongoDB Configuration
# =====================================================
mongo_systemlog_destination: "file"
mongo_systemlog_path: /var/log/mongodb/mongod.log
mongo_db_path: "{{ '/var/lib/mongodb' if ansible_os_family == 'Debian' else '/var/lib/mongo' }}"
mongo_pid_file_path: /var/run/mongodb/mongod.pid
mongo_time_zone_info: /usr/share/zoneinfo

mongo_port: 27017
mongo_bindIp: 0.0.0.0

# =====================================================
# Replication — Primary/Secondary (+ optional Arbiter)
# =====================================================
mongo_replSetName: rs0
mongo_heartbeat_timeout_secs: 10
mongo_election_timeout_millisec: 10000
master_priority: 5
slave_priority: 1
arbiter_priority: 0

# =====================================================
# Authentication — Override via Vault
# =====================================================
mongo_user_admin_name: useradmin
mongo_user_admin_pwd: changeme
mongo_root_admin_name: RootAdmin
mongo_root_admin_pwd: changeme
mongo_root_backup_name: backupuser
mongo_root_backup_pwd: changeme
mongo_custom_users: None

# =====================================================
# Prometheus Exporter (mongodb_exporter)
# =====================================================
mongodb_exporter_version: "0.40.0"
mongodb_exporter_user: mongodb_exporter
mongodb_exporter_port: 9216
mongodb_exporter_db_user: "{{ mongo_root_backup_name }}"
mongodb_exporter_db_password: "{{ mongo_root_backup_pwd }}"

# =====================================================
# MinIO Client (mc) — used for backup uploads
# =====================================================

mongodb_ha_mc_install_path: /usr/local/bin/mc

mongodb_ha_minio_alias: mongo-minio

mongodb_ha_minio_endpoint: "https://minio.ldc.opstree.dev:9000"

mongodb_ha_minio_root_user: "minioadmin"

mongodb_ha_minio_root_password: "opstreeadmin@2510"

mongodb_ha_minio_bucket: "mongodb-backup"

mongodb_ha_minio_resync_folder: failover-resync

# =====================================================
# Security Hardening
# =====================================================

mongodb_slow_op_threshold_ms: 100
mongodb_profiling_mode: slowOp

mongodb_tls_enabled: false
mongodb_tls_cert_key_file: /etc/ssl/mongodb/mongodb.pem
mongodb_tls_ca_file: /etc/ssl/mongodb/ca.pem

mongodb_ha_slack_webhook_url: ""
mongodb_ha_alert_email: ""

# =============================================================================
# Percona Backup for MongoDB (PBM)
# =============================================================================

mongodb_pbm_enabled: true

mongodb_pbm_version: "2.15.0"

mongodb_pbm_user: pbmuser

mongodb_pbm_password: changeme

mongodb_pbm_s3_endpoint: "https://minio.ldc.opstree.dev:9000"

mongodb_pbm_bucket: "mongodb-backup"

mongodb_pbm_region: "us-east-1"

mongodb_pbm_s3_access_key: minioadmin

mongodb_pbm_s3_secret_key: changeme

mongodb_pbm_tls_skip_verify: true

# =============================================================================
# Node Exporter
# =============================================================================
mongodb_node_exporter_enabled: true

node_exporter_version: "1.11.1"

node_exporter_user: "node_exporter"

node_exporter_port: 9100
